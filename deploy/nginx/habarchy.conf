# Habarchy reverse proxy: admin panel (web), API, Swagger, asynqmon.
# TLS: put fullchain.pem + privkey.pem into deploy/nginx/certs and switch
# the commented server block on (or run certbot, see deploy/README.md).

upstream habarchy_web { server web:3000; }
upstream habarchy_api { server api:8080; }
upstream habarchy_asynqmon { server asynqmon:8081; }

map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
    listen 80;
    server_name _;
    client_max_body_size 8m;

    # certbot http-01 challenge
    location /.well-known/acme-challenge/ { root /var/www/certbot; }

    # Public + admin API, callbacks, phone gateway, metrics, docs
    location ~ ^/(api/v1|api/admin|api/gateway|api/docs|callbacks|healthz|readyz|metrics)(/|$) {
        proxy_pass http://habarchy_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 90s;      # SSE (/api/admin/stream) and gateway long polls
        proxy_buffering off;
    }

    # asynqmon (protect it: the admin panel proxies /admin/queues behind login;
    # this direct route is for operators — restrict by IP or basic auth).
    location /asynqmon/ {
        allow 127.0.0.1; allow 10.0.0.0/8; allow 172.16.0.0/12; allow 192.168.0.0/16; deny all;
        proxy_pass http://habarchy_asynqmon;
        proxy_set_header Host $host;
    }

    # Everything else: Next.js admin panel
    location / {
        proxy_pass http://habarchy_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 90s;
        proxy_buffering off;
    }
}

