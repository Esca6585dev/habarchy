# Habarchy production stack: nginx → web (Next.js) + api (Go), worker,
# scheduler, Postgres 16, Redis 7, asynqmon.
#
#   cp deploy/.env.example deploy/.env    # set secrets
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env run --rm api api -seed
#
# Or from the repo root: make up / make seed / make logs.
name: habarchy

x-backend-env: &backend-env
  HABARCHY_ENV: production
  HABARCHY_LOG_PRETTY: "false"
  HABARCHY_DATABASE_URL: postgres://habarchy:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/habarchy?sslmode=disable
  HABARCHY_REDIS_URL: redis://redis:6379/0
  HABARCHY_PUBLIC_URL: ${HABARCHY_PUBLIC_URL:-http://localhost}
  HABARCHY_CORS_ORIGINS: ${HABARCHY_PUBLIC_URL:-http://localhost}
  HABARCHY_TRUSTED_PROXIES: 172.16.0.0/12
  HABARCHY_JWT_SECRET: ${HABARCHY_JWT_SECRET:?set HABARCHY_JWT_SECRET}
  HABARCHY_MASTER_KEY: ${HABARCHY_MASTER_KEY:?set HABARCHY_MASTER_KEY (api -genkey)}
  HABARCHY_WORKER_CONCURRENCY: ${HABARCHY_WORKER_CONCURRENCY:-20}
  HABARCHY_API_RATE_PER_SEC: ${HABARCHY_API_RATE_PER_SEC:-50}
  HABARCHY_WEBHOOK_ALLOW_PRIVATE: ${HABARCHY_WEBHOOK_ALLOW_PRIVATE:-false}
  HABARCHY_ADMIN_EMAIL: ${HABARCHY_ADMIN_EMAIL:-}
  HABARCHY_ADMIN_PASSWORD: ${HABARCHY_ADMIN_PASSWORD:-}
  HABARCHY_ADMIN_NAME: ${HABARCHY_ADMIN_NAME:-}

x-backend: &backend
  image: ${HABARCHY_IMAGE:-ghcr.io/esca6585dev/habarchy-backend}:${HABARCHY_TAG:-latest}
  build: { context: ../backend }
  restart: unless-stopped
  environment: *backend-env
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }
  networks: [habarchy]

services:
  api:
    <<: *backend
    command: ["api"]
    environment:
      <<: *backend-env
      HABARCHY_DB_AUTO_MIGRATE: "true"   # the api applies goose migrations on start
    expose: ["8080"]

  worker:
    <<: *backend
    command: ["worker"]
    expose: ["9090"]
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9090/metrics"]
      interval: 30s
      timeout: 3s
      retries: 5

  scheduler:
    <<: *backend
    command: ["scheduler"]
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "pgrep", "scheduler"]
      interval: 30s
      timeout: 3s
      retries: 5

  web:
    image: ${HABARCHY_WEB_IMAGE:-ghcr.io/esca6585dev/habarchy-web}:${HABARCHY_TAG:-latest}
    build:
      context: ../web
      args: { HABARCHY_API_URL: http://api:8080 }
    restart: unless-stopped
    environment:
      HABARCHY_API_URL: http://api:8080
      HABARCHY_SECURE_COOKIES: ${HABARCHY_SECURE_COOKIES:-false}
    depends_on:
      api: { condition: service_healthy }
    expose: ["3000"]
    networks: [habarchy]

  asynqmon:
    image: hibiken/asynqmon:latest
    restart: unless-stopped
    command: ["--redis-addr=redis:6379", "--port=8081", "--root-path=/asynqmon"]
    depends_on:
      redis: { condition: service_healthy }
    expose: ["8081"]
    networks: [habarchy]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/habarchy.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro        # fullchain.pem + privkey.pem (optional, see README)
      - certbot-www:/var/www/certbot
    depends_on: [web, api]
    networks: [habarchy]

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: habarchy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: habarchy
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U habarchy -d habarchy"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [habarchy]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [habarchy]

volumes:
  pgdata:
  redisdata:
  certbot-www:

networks:
  habarchy:
