name: web
on:
  push:
    branches: [main]
    paths: ["web/**", "backend/api/openapi.yaml", ".github/workflows/web.yml"]
  pull_request:
    paths: ["web/**", "backend/api/openapi.yaml", ".github/workflows/web.yml"]
permissions: { contents: read }
jobs:
  lint-build:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci --no-audit --no-fund
      - name: Generated API types are up to date
        run: npm run openapi && git diff --exit-code -- src/lib/api/schema.d.ts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
        env: { HABARCHY_API_URL: http://localhost:8080 }
