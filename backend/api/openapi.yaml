    parameters: [{ $ref: "#/components/parameters/ProjectID" }]
    post:
      tags: [admin-contacts]
      summary: Import from iCloud (Apple ID + app-specific password) or any CardDAV server
      description: Credentials are used for this request only and never stored. Default server_url is https://contacts.icloud.com/.
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                server_url: { type: string, default: "https://contacts.icloud.com/" }
                username: { type: string, description: Apple ID e-mail }
                password: { type: string, description: app-specific password from appleid.apple.com }
                group_id: { type: string, format: uuid }
                dry_run: { type: boolean }
                tag: { type: string }
      responses:
        "200": { $ref: "#/components/responses/ImportResult" }
        "400": { $ref: "#/components/responses/Error" }
  /api/admin/projects/{project_id}/contacts/import/google/url:
    parameters: [{ $ref: "#/components/parameters/ProjectID" }]
    get:
      tags: [admin-contacts]
      summary: Google Contacts consent URL (requires HABARCHY_GOOGLE_CLIENT_ID / SECRET)
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: group_id, in: query, schema: { type: string, format: uuid } }
        - { name: return_to, in: query, schema: { type: string }, description: where the browser is sent after the import (web); empty shows a result page (mobile) }
      responses:
        "200":
          description: "`{url}`"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties: { data: { type: object, properties: { url: { type: string } } } }
  /api/admin/integrations/google/callback:
    get:
      tags: [admin-contacts]
      summary: OAuth redirect target (authenticated by the signed state); imports and redirects to return_to
      parameters:
        - { name: code, in: query, schema: { type: string } }
        - { name: state, in: query, schema: { type: string } }
      responses:
        "302": { description: Redirect to return_to with imported/created/skipped or import_error }
        "200": { description: HTML result page when return_to is empty }
  /api/admin/me/profile:
    put:
      tags: [admin-auth]
      summary: Update the signed-in user's name, bio and avatar
      security: [{ BearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [full_name], properties: { full_name: { type: string }, bio: { type: string }, avatar_id: { type: string, format: uuid } } } } } }
      responses: { "200": { description: User } }
  /api/admin/attachments:
    post:
      tags: [admin-chat]
      summary: Upload an image (avatar or chat image, max 5 MB)
      security: [{ BearerAuth: [] }]
      requestBody: { required: true, content: { multipart/form-data: { schema: { type: object, required: [file], properties: { file: { type: string, format: binary } } } } } }
      responses: { "201": { description: "`{id, content_type, size_bytes, filename}`" } }
  /api/admin/attachments/{attachment_id}:
    get:
      tags: [admin-chat]
      summary: Serve an attachment (token via header, cookie or ?access_token=)
      security: [{ BearerAuth: [] }]
      parameters: [{ name: attachment_id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { "200": { description: image bytes } }
  /api/admin/chat/stream:
    get:
      tags: [admin-chat]
      summary: SSE feed of chat events for the signed-in user (token via header, cookie or ?access_token=)
      security: [{ BearerAuth: [] }]
      responses: { "200": { description: "text/event-stream of message / message.deleted / channel events" } }
  /api/admin/chat/channels:
    get:
      tags: [admin-chat]
      summary: List my channels with unread counts, last message and DM peer
      security: [{ BearerAuth: [] }]
      responses: { "200": { description: channels } }
    post:
      tags: [admin-chat]
      summary: Create a public or private (group) channel
      security: [{ BearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [kind, name], properties: { kind: { type: string, enum: [public, private] }, name: { type: string }, topic: { type: string }, members: { type: array, items: { type: string, format: uuid } } } } } } }
      responses: { "201": { description: channel } }
  /api/admin/chat/direct:
    post:
      tags: [admin-chat]
      summary: Open (or get) a direct chat with another user
      security: [{ BearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [user_id], properties: { user_id: { type: string, format: uuid } } } } } }
      responses: { "200": { description: "`{id, kind}`" } }
  /api/admin/chat/channels/{channel_id}/members:
    parameters: [{ name: channel_id, in: path, required: true, schema: { type: string, format: uuid } }]
    get:
      tags: [admin-chat]
      summary: List channel members
      security: [{ BearerAuth: [] }]
      responses: { "200": { description: members } }
    post:
      tags: [admin-chat]
      summary: Add members to a private group
      security: [{ BearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [user_ids], properties: { user_ids: { type: array, items: { type: string, format: uuid } } } } } } }
      responses: { "204": { description: added } }
  /api/admin/chat/channels/{channel_id}/leave:
    parameters: [{ name: channel_id, in: path, required: true, schema: { type: string, format: uuid } }]
    post:
      tags: [admin-chat]
      summary: Leave a channel
      security: [{ BearerAuth: [] }]
      responses: { "204": { description: left } }
  /api/admin/chat/channels/{channel_id}/read:
    parameters: [{ name: channel_id, in: path, required: true, schema: { type: string, format: uuid } }]
    post:
      tags: [admin-chat]
      summary: Mark the channel read up to now
      security: [{ BearerAuth: [] }]
      responses: { "204": { description: ok } }
  /api/admin/chat/channels/{channel_id}/messages:
    parameters: [{ name: channel_id, in: path, required: true, schema: { type: string, format: uuid } }]
    get:
      tags: [admin-chat]
      summary: List messages (newest first; page back with before=<message id>)
      security: [{ BearerAuth: [] }]
      parameters: [{ name: before, in: query, schema: { type: string, format: uuid } }, { name: limit, in: query, schema: { type: integer, default: 50, maximum: 100 } }]
      responses: { "200": { description: messages } }
    post:
      tags: [admin-chat]
      summary: Post a message (text and/or an uploaded attachment_id)
      security: [{ BearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { body: { type: string }, attachment_id: { type: string, format: uuid } } } } } }
      responses: { "201": { description: message } }
  /api/admin/chat/channels/{channel_id}/messages/{message_id}:
    parameters: [{ name: channel_id, in: path, required: true, schema: { type: string, format: uuid } }, { name: message_id, in: path, required: true, schema: { type: string, format: uuid } }]
    delete:
      tags: [admin-chat]
      summary: Delete your own message
      security: [{ BearerAuth: [] }]
      responses: { "204": { description: deleted } }
  /api/admin/projects/{project_id}/contacts/trash:
    parameters: [{ $ref: "#/components/parameters/ProjectID" }]
    get:
      tags: [admin-contacts]
      summary: List trashed (soft-deleted) contacts
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: search, in: query, schema: { type: string } }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Offset" }
      responses:
        "200": { $ref: "#/components/responses/ContactList" }
    delete:
      tags: [admin-contacts]
      summary: Permanently delete every contact in the trash
      security: [{ BearerAuth: [] }]
      responses:
        "200":
          description: "`{purged}`"
          content: { application/json: { schema: { allOf: [ { $ref: "#/components/schemas/Envelope" }, { type: object, properties: { data: { type: object, properties: { purged: { type: integer } } } } } ] } } }
  /api/admin/projects/{project_id}/contacts/{contact_id}/restore:
    parameters: [{ $ref: "#/components/parameters/ProjectID" }, { name: contact_id, in: path, required: true, schema: { type: string, format: uuid } }]
    post:
      tags: [admin-contacts]
      summary: Restore a contact from the trash
      security: [{ BearerAuth: [] }]
      responses:
        "200": { $ref: "#/components/responses/Contact" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/admin/projects/{project_id}/contacts/{contact_id}/purge:
    parameters: [{ $ref: "#/components/parameters/ProjectID" }, { name: contact_id, in: path, required: true, schema: { type: string, format: uuid } }]
    delete:
      tags: [admin-contacts]
      summary: Permanently delete one trashed contact
      security: [{ BearerAuth: [] }]
      responses:
        "204": { description: Purged }
        "404": { $ref: "#/components/responses/Error" }
  /api/admin/projects/{project_id}/contacts/{contact_id}:
    parameters: [{ $ref: "#/components/parameters/ProjectID" }, { name: contact_id, in: path, required: true, schema: { type: string, format: uuid } }]
    get:
      tags: [admin-contacts]
      summary: Contact with its groups
      security: [{ BearerAuth: [] }]
      responses:
        "200":
          description: Contact + groups
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          contact: { $ref: "#/components/schemas/Contact" }
                          groups: { type: array, items: { $ref: "#/components/schemas/Group" } }
    put:
      tags: [admin-contacts]
      summary: Update a contact
      security: [{ BearerAuth: [] }]
      requestBody: { $ref: "#/components/requestBodies/Contact" }
      responses:
        "200": { $ref: "#/components/responses/Contact" }
    delete:
      tags: [admin-contacts]
      summary: Soft-delete a contact (kept in the trash, hidden everywhere, restorable)
      security: [{ BearerAuth: [] }]
      responses:
        "204": { description: Soft-deleted }
  /api/admin/projects/{project_id}/messages/send:
    parameters: [{ $ref: "#/components/parameters/ProjectID" }]
    post:
      tags: [admin-messages]
      summary: Compose and send to groups, contacts and/or raw addresses (developer role)
      security: [{ BearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/AdminSendRequest" } } } }
      responses:
        "202":
          description: Batch created; `meta.accepted` / `meta.rejected`
          content: { application/json: { schema: { $ref: "#/components/schemas/BatchEnvelope" } } }
        "400": { $ref: "#/components/responses/Error" }
  /api/admin/projects/{project_id}/groups:
    parameters: [{ $ref: "#/components/parameters/ProjectID" }]
    get:
      tags: [admin-contacts]
      summary: List contact groups
      security: [{ BearerAuth: [] }]
      responses:
        "200": { $ref: "#/components/responses/GroupList" }
    post:
      tags: [admin-contacts]
      summary: Create a group
      security: [{ BearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/GroupRequest" } } } }
      responses:
        "201": { $ref: "#/components/responses/Group" }
        "409": { $ref: "#/components/responses/Error" }
  /api/admin/projects/{project_id}/groups/{group_id}:
    parameters: [{ $ref: "#/components/parameters/ProjectID" }, { name: group_id, in: path, required: true, schema: { type: string, format: uuid } }]
    get:
      tags: [admin-contacts]
      summary: Get a group
      security: [{ BearerAuth: [] }]
      responses:
        "200": { $ref: "#/components/responses/Group" }
    put:
      tags: [admin-contacts]
      summary: Rename a group
      security: [{ BearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/GroupRequest" } } } }
      responses:
        "200": { $ref: "#/components/responses/Group" }
    delete:
      tags: [admin-contacts]
      summary: Delete a group (contacts stay)
      security: [{ BearerAuth: [] }]
      responses:
        "204": { description: Deleted }
  /api/admin/projects/{project_id}/groups/{group_id}/members:
    parameters: [{ $ref: "#/components/parameters/ProjectID" }, { name: group_id, in: path, required: true, schema: { type: string, format: uuid } }]
    get:
      tags: [admin-contacts]
      summary: List members
      security: [{ BearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/Limit" }, { $ref: "#/components/parameters/Offset" }]
      responses:
        "200": { $ref: "#/components/responses/ContactList" }
    post:
      tags: [admin-contacts]
      summary: Add members (existing contacts or new ones inline)
      security: [{ BearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/GroupMembersRequest" } } } }
      responses:
        "200":
          description: Result
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties: { data: { $ref: "#/components/schemas/GroupMembersResult" } }
  /api/admin/projects/{project_id}/groups/{group_id}/members/{contact_id}:
    parameters: [{ $ref: "#/components/parameters/ProjectID" }, { name: group_id, in: path, required: true, schema: { type: string, format: uuid } }, { name: contact_id, in: path, required: true, schema: { type: string, format: uuid } }]
    delete:
      tags: [admin-contacts]
      summary: Remove a member
      security: [{ BearerAuth: [] }]
      responses:
        "204": { description: Removed }
  /api/admin/projects/{project_id}/devices:
    parameters: [{ $ref: "#/components/parameters/ProjectID" }]
    get:
      tags: [admin-insights]
      summary: Devices (tokens masked)
      security: [{ BearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/Limit" }, { $ref: "#/components/parameters/Offset" }]
      responses:
        "200":
          description: Devices
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties: { data: { type: array, items: { $ref: "#/components/schemas/AdminDevice" } } }

components:
  securitySchemes:
    ApiKey:
      type: apiKey
      in: header
      name: X-Api-Key
      description: "`hb_live_...` or `hb_test_...`. Optionally sign requests with `X-Timestamp` and `X-Signature` (see docs/auth.md)."
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    GatewayKey:
      type: apiKey
      in: header
      name: X-Gateway-Key
      description: "Pairing key of an `android_sms` provider (Habarçy Gateway app)."

  parameters:
    ProjectID: { name: project_id, in: path, required: true, schema: { type: string, format: uuid } }
    MessageID: { name: message_id, in: path, required: true, schema: { type: string, format: uuid } }
    TemplateID: { name: template_id, in: path, required: true, schema: { type: string, format: uuid } }
    ProviderID: { name: provider_id, in: path, required: true, schema: { type: string, format: uuid } }
    DeliveryID: { name: delivery_id, in: path, required: true, schema: { type: string, format: uuid } }
    Limit: { name: limit, in: query, schema: { type: integer, default: 50, maximum: 200 } }
    Offset: { name: offset, in: query, schema: { type: integer, default: 0 } }

  requestBodies:
    RefreshToken:
      required: true
      content:
        application/json:
          schema: { type: object, required: [refresh_token], properties: { refresh_token: { type: string } } }
    Template:
      required: true
      content: { application/json: { schema: { $ref: "#/components/schemas/TemplateRequest" } } }
    TemplateUpdate:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              subject: { type: string }
              body: { type: string }
              is_active: { type: boolean }
    Preview:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [body]
            properties:
              channel: { $ref: "#/components/schemas/Channel" }
              subject: { type: string }
              body: { type: string }
              data: { type: object, additionalProperties: true }
    Contact:
      required: true
      content: { application/json: { schema: { $ref: "#/components/schemas/ContactRequest" } } }
    Provider:
      required: true
      content: { application/json: { schema: { $ref: "#/components/schemas/ProviderRequest" } } }

  responses:
    Error:
      description: Error envelope
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
    Status:
      description: Status envelope
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Envelope"
              - type: object
                properties: { data: { type: object, additionalProperties: true } }
    User:
      description: User
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Envelope"
              - type: object
                properties: { data: { $ref: "#/components/schemas/User" } }
    Project:
      description: Project
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Envelope"
              - type: object
                properties: { data: { $ref: "#/components/schemas/Project" } }
    ProjectList:
      description: Projects
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Envelope"
              - type: object
                properties: { data: { type: array, items: { $ref: "#/components/schemas/Project" } } }
    Provider:
      description: Provider
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Envelope"
              - type: object
                properties: { data: { $ref: "#/components/schemas/Provider" } }
    ProviderList:
      description: Providers
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Envelope"
              - type: object
                properties: { data: { type: array, items: { $ref: "#/components/schemas/Provider" } } }
    Template:
      description: Template
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Envelope"
              - type: object
                properties: { data: { $ref: "#/components/schemas/Template" } }
    TemplateList:
      description: Templates
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Envelope"
              - type: object
                properties: { data: { type: array, items: { $ref: "#/components/schemas/Template" } } }
    Preview:
      description: Rendered preview
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Envelope"
              - type: object
                properties: { data: { $ref: "#/components/schemas/Preview" } }
    Contact:
      description: Contact
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Envelope"
              - type: object
                properties: { data: { $ref: "#/components/schemas/Contact" } }
    ImportResult:
      description: Import summary
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Envelope"
              - type: object
                properties: { data: { $ref: "#/components/schemas/ImportResult" } }
    Group:
      description: Group
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Envelope"
              - type: object
                properties: { data: { $ref: "#/components/schemas/Group" } }
    GroupList:
      description: Groups
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Envelope"
              - type: object
                properties: { data: { type: array, items: { $ref: "#/components/schemas/Group" } } }
    ContactList:
      description: Contacts
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Envelope"
              - type: object
                properties: { data: { type: array, items: { $ref: "#/components/schemas/Contact" } } }
    UsageList:
      description: Usage rows
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Envelope"
              - type: object
                properties: { data: { type: array, items: { $ref: "#/components/schemas/UsageRow" } } }
        text/csv:
          schema: { type: string }

  schemas:
    Envelope:
      type: object
      properties:
        data: {}
        meta: { type: object, additionalProperties: true }
        error: { $ref: "#/components/schemas/APIError" }
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error: { $ref: "#/components/schemas/APIError" }
    APIError:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum: [validation_failed, unauthorized, forbidden_scope, not_found, quota_exceeded, rate_limited, duplicate_request, provider_unavailable, invalid_recipient, conflict, internal_error]
        message: { type: string }
        details: { type: object, additionalProperties: true }

    Channel: { type: string, enum: [sms, email, push, telegram, whatsapp, slack] }
    ChannelOrAuto: { type: string, enum: [sms, email, push, telegram, auto] }
    MessageStatus: { type: string, enum: [queued, processing, sent, delivered, failed, cancelled] }
    Priority: { type: string, enum: [high, normal, low] }
    Locale: { type: string, enum: [tk, ru, en] }
    Role: { type: string, enum: [owner, admin, developer, viewer] }
    ProviderType: { type: string, enum: [http_sms, smpp, android_sms, smtp, fcm, telegram_bot, whatsapp_cloud, slack] }
    Scope: { type: string, enum: ["messages:send", "messages:read", otp, templates, contacts, devices, usage] }

    Recipient:
      description: A raw address (E.164 phone, email, FCM token, chat id) or a contact reference.
      oneOf:
        - type: string
        - type: object
          properties:
            contact_id: { type: string, format: uuid }
            external_id: { type: string }
            address: { type: string }
    SendMessageRequest:
      type: object
      required: [to]
      properties:
        channel: { $ref: "#/components/schemas/ChannelOrAuto" }
        to: { $ref: "#/components/schemas/Recipient" }
        template: { type: string, description: "template key; mutually exclusive with body" }
        data: { type: object, additionalProperties: true }
        subject: { type: string }
        title: { type: string, description: push notification title }
        body: { type: string, description: "ad hoc body; may contain {{.var}} placeholders" }
        locale: { $ref: "#/components/schemas/Locale" }
        scheduled_at: { type: string, format: date-time }
        priority: { $ref: "#/components/schemas/Priority" }
        idempotency_key: { type: string, maxLength: 128 }
        metadata:
          type: object
          additionalProperties: true
          description: Returned in webhooks. Special keys - `data` (push data payload), `parse_mode` (telegram), `reply_to`, `text`, `attachments` (email).
    SendBatchRequest:
      type: object
      description: "`recipients` and/or `group_ids` are required"
      properties:
        channel: { $ref: "#/components/schemas/Channel" }
        group_ids: { type: array, items: { type: string, format: uuid }, description: send to every member of these contact groups }
        data: { type: object, additionalProperties: true, description: shared template data (a recipient's own data overlays it) }
        template: { type: string }
        subject: { type: string }
        title: { type: string }
        body: { type: string }
        locale: { $ref: "#/components/schemas/Locale" }
        scheduled_at: { type: string, format: date-time }
        priority: { $ref: "#/components/schemas/Priority" }
        idempotency_key: { type: string }
        metadata: { type: object, additionalProperties: true }
        recipients:
          type: array
          maxItems: 1000
          items:
            type: object
            required: [to]
            properties:
              to: { $ref: "#/components/schemas/Recipient" }
              data: { type: object, additionalProperties: true }
    Accepted:
      type: object
      properties:
        id: { type: string, format: uuid }
        status: { $ref: "#/components/schemas/MessageStatus" }
        channel: { $ref: "#/components/schemas/Channel" }
        to: { type: string }
        scheduled_at: { type: [string, "null"], format: date-time }
    Message:
      type: object
      properties:
        id: { type: string, format: uuid }
        status: { $ref: "#/components/schemas/MessageStatus" }
        channel: { $ref: "#/components/schemas/Channel" }
        to: { type: string }
        contact_id: { type: string, format: uuid }
        batch_id: { type: string, format: uuid }
        template: { type: string }
        template_version: { type: integer }
        subject: { type: string }
        body: { type: string }
        priority: { $ref: "#/components/schemas/Priority" }
        provider_id: { type: string, format: uuid }
        provider_message_id: { type: string }
        error_code: { type: string }
        error_message: { type: string }
        attempts: { type: integer }
        scheduled_at: { type: string, format: date-time }
        sent_at: { type: string, format: date-time }
        delivered_at: { type: string, format: date-time }
        cost_micros: { type: integer }
        currency: { type: string }
        metadata: { type: object, additionalProperties: true }
        idempotency_key: { type: string }
        is_test: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    MessageEvent:
      type: object
      properties:
        id: { type: string, format: uuid }
        type: { type: string, enum: [queued, attempt, provider_response, sent, delivered, failed, cancelled, webhook_sent] }
        provider_id: { type: string, format: uuid }
        payload: { type: object, additionalProperties: true }
        created_at: { type: string, format: date-time }
    MessageEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties: { data: { $ref: "#/components/schemas/Message" } }
    MessageListEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data: { type: array, items: { $ref: "#/components/schemas/Message" } }
            meta:
              type: object
              properties:
                next_cursor: { type: [string, "null"], format: uuid }
                limit: { type: integer }
    MessageDetailEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              type: object
              properties:
                message: { $ref: "#/components/schemas/Message" }
                events: { type: array, items: { $ref: "#/components/schemas/MessageEvent" } }
    Batch:
      type: object
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [processing, completed] }
        channel: { $ref: "#/components/schemas/Channel" }
        template: { type: string }
        total: { type: integer }
        queued: { type: integer }
        sent: { type: integer }
        delivered: { type: integer }
        failed: { type: integer }
        created_at: { type: string, format: date-time }
        completed_at: { type: string, format: date-time }
    BatchEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data: { $ref: "#/components/schemas/Batch" }
            meta:
              type: object
              properties:
                accepted: { type: integer }
                rejected:
                  type: array
                  items:
                    type: object
                    properties: { index: { type: integer }, to: { type: string }, reason: { type: string } }
                duplicate: { type: boolean }

    OTPSendRequest:
      type: object
      required: [to]
      properties:
        channel: { type: string, enum: [sms, email, telegram], default: sms }
        to: { type: string }
        length: { type: integer, minimum: 4, maximum: 10 }
        ttl: { type: integer, description: seconds, minimum: 30, maximum: 3600 }
        template: { type: string, default: otp }
        locale: { $ref: "#/components/schemas/Locale" }
        data: { type: object, additionalProperties: true }
    OTPSendResult:
      type: object
      properties:
        message_id: { type: string, format: uuid }
        to: { type: string }
        channel: { type: string }
        expires_in: { type: integer }
        length: { type: integer }
    OTPVerifyResult:
      type: object
      properties:
        verified: { type: boolean }
        attempts_remaining: { type: integer }

    TemplateRequest:
      type: object
      required: [key, channel, body]
      properties:
        key: { type: string, pattern: "^[a-z0-9][a-z0-9_.-]{0,63}$" }
        channel: { $ref: "#/components/schemas/Channel" }
        locale: { $ref: "#/components/schemas/Locale" }
        subject: { type: string }
        body: { type: string }
    Template:
      type: object
      properties:
        id: { type: string, format: uuid }
        key: { type: string }
        channel: { $ref: "#/components/schemas/Channel" }
        locale: { $ref: "#/components/schemas/Locale" }
        subject: { type: string }
        body: { type: string }
        required_vars: { type: array, items: { type: string } }
        version: { type: integer }
        is_active: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    TemplateVersion:
      type: object
      properties:
        version: { type: integer }
        subject: { type: string }
        body: { type: string }
        required_vars: { type: array, items: { type: string } }
        created_by: { type: [string, "null"], format: uuid }
        created_at: { type: string, format: date-time }
    Preview:
      type: object
      properties:
        subject: { type: string }
        body: { type: string }
        required_vars: { type: array, items: { type: string } }
        missing_vars: { type: array, items: { type: string } }

    ContactRequest:
      type: object
      properties:
        external_id: { type: string }
        name: { type: string }
        phone: { type: string }
        email: { type: string }
        whatsapp: { type: string, description: "E.164; empty = phone" }
        telegram_chat_id: { type: string }
        slack_id: { type: string, description: Slack user (U…) or channel (C…) id }
        locale: { $ref: "#/components/schemas/Locale" }
        tags: { type: array, items: { type: string } }
        attributes: { type: object, additionalProperties: true }
    Group:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        member_count: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ImportResult:
      type: object
      properties:
        total: { type: integer }
        created: { type: integer }
        updated: { type: integer }
        unchanged: { type: integer }
        skipped: { type: integer }
        group_added: { type: integer }
        dry_run: { type: boolean }
        errors: { type: array, items: { type: object, properties: { row: { type: integer }, reason: { type: string }, line: { type: string } } } }
        preview: { type: array, items: { type: object, additionalProperties: true }, description: first 20 parsed contacts }
    GroupRequest:
      type: object
      required: [name]
      properties: { name: { type: string }, description: { type: string } }
    GroupMembersRequest:
      type: object
      description: existing contacts by id / external_id, or new contacts created inline (matched by external_id, phone or email first)
      properties:
        contact_ids: { type: array, items: { type: string, format: uuid } }
        external_ids: { type: array, items: { type: string } }
        contacts: { type: array, items: { $ref: "#/components/schemas/ContactRequest" } }
    GroupMembersResult:
      type: object
      properties: { added: { type: integer }, created_contacts: { type: integer }, not_found: { type: array, items: { type: string } } }
    AdminSendRequest:
      type: object
      description: Compose from the admin panel / app. `group_ids`, `contact_ids` and/or `to` are required.
      properties:
        channel: { $ref: "#/components/schemas/Channel" }
        template: { type: string }
        data: { type: object, additionalProperties: true }
        subject: { type: string }
        title: { type: string }
        body: { type: string }
        locale: { $ref: "#/components/schemas/Locale" }
        scheduled_at: { type: string, format: date-time }
        priority: { $ref: "#/components/schemas/Priority" }
        metadata: { type: object, additionalProperties: true }
        group_ids: { type: array, items: { type: string, format: uuid } }
        contact_ids: { type: array, items: { type: string, format: uuid } }
        to: { type: array, items: { type: string }, description: raw addresses (phones, e-mails, chat ids) }
        is_test: { type: boolean, description: route through the sandbox, nothing is really sent }
    Contact:
      type: object
      properties:
        id: { type: string, format: uuid }
        external_id: { type: string }
        name: { type: string }
        phone: { type: string }
        email: { type: string }
        whatsapp: { type: string }
        telegram_chat_id: { type: string }
        slack_id: { type: string }
        deleted_at: { type: [string, "null"], format: date-time, description: set when the contact is in the trash (soft-deleted) }
        locale: { type: string }
        tags: { type: array, items: { type: string } }
        attributes: { type: object, additionalProperties: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    DeviceRequest:
      type: object
      required: [token, platform]
      properties:
        token: { type: string }
        platform: { type: string, enum: [android, ios, web] }
        app_version: { type: string }
        contact_id: { type: string, format: uuid }
        external_id: { type: string }
    Device:
      type: object
      properties:
        id: { type: string, format: uuid }
        contact_id: { type: string, format: uuid }
        platform: { type: string }
        token_hint: { type: string }
        app_version: { type: string }
        is_active: { type: boolean }
        last_seen_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
    AdminDevice:
      type: object
      properties:
        ID: { type: string, format: uuid }
        ProjectID: { type: string, format: uuid }
        ContactID: { type: [string, "null"], format: uuid }
        Platform: { type: string }
        fcm_token: { type: string, description: masked }
        AppVersion: { type: string }
        LastSeenAt: { type: string, format: date-time }
        IsActive: { type: boolean }
        CreatedAt: { type: string, format: date-time }
    UsageRow:
      type: object
      properties:
        day: { type: string }
        channel: { type: string }
        queued: { type: integer }
        sent: { type: integer }
        delivered: { type: integer }
        failed: { type: integer }
        cost_micros: { type: integer }
        currency: { type: string }

    Tokens:
      type: object
      properties:
        access_token: { type: string }
        refresh_token: { type: string }
        token_type: { type: string }
        expires_in: { type: integer }
    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        full_name: { type: string }
        is_active: { type: boolean }
        totp_enabled: { type: boolean }
        last_login_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
    Overview:
      type: object
      properties:
        projects: { type: integer }
        users: { type: integer }
        messages_24h: { type: integer }
        pending: { type: integer }
        webhooks_pending: { type: integer }

    CreateProjectRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 2 }
        slug: { type: string }
        daily_quota: { type: integer }
        monthly_quota: { type: integer }
        default_locale: { $ref: "#/components/schemas/Locale" }
    UpdateProjectRequest:
      type: object
      properties:
        name: { type: string }
        status: { type: string, enum: [active, suspended, archived] }
        daily_quota: { type: integer }
        monthly_quota: { type: integer }
        webhook_url: { type: string }
        webhook_secret: { type: string, description: "plaintext; stored encrypted" }
        default_locale: { $ref: "#/components/schemas/Locale" }
        allowed_ips: { type: array, items: { type: string } }
        auto_channel_order: { type: array, items: { $ref: "#/components/schemas/Channel" } }
    Project:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        status: { type: string }
        daily_quota: { type: integer }
        monthly_quota: { type: integer }
        webhook_url: { type: string }
        has_webhook_secret: { type: boolean }
        default_locale: { type: string }
        allowed_ips: { type: array, items: { type: string } }
        auto_channel_order: { type: array, items: { $ref: "#/components/schemas/Channel" } }
        role: { $ref: "#/components/schemas/Role" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    Member:
      type: object
      properties:
        user_id: { type: string, format: uuid }
        email: { type: string }
        full_name: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        joined_at: { type: string, format: date-time }
    CreateAPIKeyRequest:
      type: object
      required: [name]
      properties:
        name: { type: string }
        live: { type: boolean, description: "true → hb_live_ key reaching real providers; false → hb_test_ sandbox" }
        scopes: { type: array, items: { $ref: "#/components/schemas/Scope" } }
        ip_allowlist: { type: array, items: { type: string } }
        expires_at: { type: string, format: date-time }
        require_signature: { type: boolean }
    APIKey:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        prefix: { type: string }
        hint: { type: string }
        key: { type: string, description: plaintext, only on creation }
        scopes: { type: array, items: { type: string } }
        ip_allowlist: { type: array, items: { type: string } }
        require_signature: { type: boolean }
        last_used_at: { type: [string, "null"], format: date-time }
        expires_at: { type: [string, "null"], format: date-time }
        revoked_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
    ProviderRequest:
      type: object
      properties:
        name: { type: string }
        type: { $ref: "#/components/schemas/ProviderType" }
        priority: { type: integer, description: lower is tried first }
        is_active: { type: boolean }
        credentials: { type: object, additionalProperties: true, description: see docs/providers.md for each type }
        rate_limit_per_sec: { type: integer }
    Provider:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        channel: { $ref: "#/components/schemas/Channel" }
        type: { $ref: "#/components/schemas/ProviderType" }
        priority: { type: integer }
        is_active: { type: boolean }
        rate_limit_per_sec: { type: integer }
        settings: { type: object, additionalProperties: true, description: credentials with secrets masked }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    GatewayPairing:
      type: object
      properties:
        provider_id: { type: string, format: uuid }
        name: { type: string }
        api_url: { type: string }
        gateway_key: { type: string }
        sim_slot: { type: integer }
        qr: { type: string, description: "habarchy://gateway?url=…&key=…" }
        online: { type: boolean }
        last_seen_at: { type: [string, "null"], format: date-time }
        device_info: { type: object, additionalProperties: true }
    InboundSMS:
      type: object
      properties:
        id: { type: string, format: uuid }
        provider_id: { type: string, format: uuid }
        from: { type: string }
        text: { type: string }
        received_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
    OutboxItem:
      type: object
      properties:
        id: { type: string, format: uuid }
        message_id: { type: string, format: uuid }
        to: { type: string }
        text: { type: string }
        sim_slot: { type: integer, description: "-1 default SIM, 0 or 1" }
        expires_at: { type: string, format: date-time }
    TestSendResult:
      type: object
      properties:
        ok: { type: boolean }
        duration_ms: { type: integer }
        provider_message_id: { type: string }
        raw: { type: object, additionalProperties: true }
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
            retryable: { type: boolean }
            raw: { type: object, additionalProperties: true }
    WebhookDelivery:
      type: object
      properties:
        id: { type: string, format: uuid }
        event: { type: string }
        url: { type: string }
        message_id: { type: string, format: uuid }
        batch_id: { type: string, format: uuid }
        payload: { type: object, additionalProperties: true }
        response_code: { type: [integer, "null"] }
        response_body: { type: string }
        attempts: { type: integer }
        next_retry_at: { type: [string, "null"], format: date-time }
        delivered_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
        status: { type: string, enum: [delivered, pending, failed] }
    Totals:
      type: object
      properties:
        total: { type: integer }
        sent: { type: integer }
        delivered: { type: integer }
        failed: { type: integer }
        pending: { type: integer }
        cost_micros: { type: integer }
    Dashboard:
      type: object
      properties:
        window:
          type: object
          properties: { From: { type: string, format: date-time }, To: { type: string, format: date-time } }
        totals: { $ref: "#/components/schemas/Totals" }
        latency:
          type: object
          properties:
            p50_sent_sec: { type: number }
            p95_sent_sec: { type: number }
            p95_delivered_sec: { type: number }
            samples: { type: integer }
        daily:
          type: array
          items:
            allOf:
              - $ref: "#/components/schemas/Totals"
              - type: object
                properties: { day: { type: string }, channel: { type: string } }
        recent_failures: { type: array, items: { type: object, additionalProperties: true } }
        by_channel: { type: object, additionalProperties: { $ref: "#/components/schemas/Totals" } }
    Health:
      type: object
      properties:
        queues:
          type: array
          items:
            type: object
            properties:
              queue: { type: string }
              pending: { type: integer }
              active: { type: integer }
              scheduled: { type: integer }
              retry: { type: integer }
              archived: { type: integer }
              processed_today: { type: integer }
              failed_today: { type: integer }
        providers:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              name: { type: string }
              channel: { type: string }
              type: { type: string }
              is_active: { type: boolean }
              priority: { type: integer }
              ok_count: { type: integer }
              failed_count: { type: integer }
              last_sent_at: { type: [string, "null"], format: date-time }
              status: { type: string, enum: [healthy, degraded, failing, idle, disabled, offline] }
              gateway:
                type: object
                description: Present for android_sms providers (phone heartbeat)
                properties:
                  online: { type: boolean }
                  last_seen_at: { type: [string, "null"], format: date-time }
                  pending: { type: integer }
                  info: { type: object, additionalProperties: true }
        devices:
          type: object
          properties: { active: { type: integer }, total: { type: integer } }
        contacts: { type: integer }
    AuditLog:
      type: object
      properties:
        ID: { type: string, format: uuid }
        ProjectID: { type: [string, "null"], format: uuid }
        UserID: { type: [string, "null"], format: uuid }
        Action: { type: string }
        EntityType: { type: string }
        EntityID: { type: string }
        Changes: { type: object, additionalProperties: true }
        Ip: { type: string }
        UserAgent: { type: string }
        CreatedAt: { type: string, format: date-time }
