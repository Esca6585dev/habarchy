  /api/gateway/v1/me:
    get:
      tags: [gateway]
      summary: Who am I (phone pairing check)
      security: [{ GatewayKey: [] }]
      responses:
        "200": { description: "Provider, project, pending count, `inbound_enabled`, `sim_slot`" }
        "401": { description: Invalid gateway key, disabled provider or suspended project }
  /api/gateway/v1/outbox:
    get:
      tags: [gateway]
      summary: Lease pending SMS (long poll)
      description: Returns up to `limit` SMS the phone must send and marks them leased. Waits up to `wait` seconds (max 25) when the outbox is empty.
      security: [{ GatewayKey: [] }]
      parameters:
        - { name: wait, in: query, schema: { type: integer, default: 20, minimum: 0, maximum: 25 } }
        - { name: limit, in: query, schema: { type: integer, default: 5, minimum: 1, maximum: 20 } }
      responses:
        "200":
          description: Items to send
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties: { data: { type: array, items: { $ref: "#/components/schemas/OutboxItem" } } }
  /api/gateway/v1/outbox/{outbox_id}/result:
    parameters: [{ name: outbox_id, in: path, required: true, schema: { type: string, format: uuid } }]
    post:
      tags: [gateway]
      summary: Report sent / failed / delivered for an outbox item
      security: [{ GatewayKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [sent, failed, delivered] }
                error_code: { type: string, description: "Android SmsManager result: generic_failure, radio_off, null_pdu, no_service, limit_exceeded, …" }
                error_message: { type: string }
                parts: { type: integer }
      responses:
        "200": { description: "`{id, status, applied}`" }
        "404": { description: Unknown outbox id for this phone }
  /api/gateway/v1/heartbeat:
    post:
      tags: [gateway]
      summary: Phone heartbeat (battery, network, operator, app version)
      security: [{ GatewayKey: [] }]
      requestBody: { content: { application/json: { schema: { type: object, additionalProperties: true } } } }
      responses:
        "200": { description: "`{ok, pending, server_time}`" }
  /api/gateway/v1/inbound:
    post:
      tags: [gateway]
      summary: Forward an SMS the phone received (fires the sms.inbound webhook; 403 when the provider has inbound_enabled=false)
      security: [{ GatewayKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [from, text]
              properties: { from: { type: string }, text: { type: string }, received_at: { type: string, format: date-time } }
