        "201": { $ref: "#/components/responses/Contact" }
        "200": { $ref: "#/components/responses/Contact" }
  /api/admin/projects/{project_id}/contacts/import:
    parameters: [{ $ref: "#/components/parameters/ProjectID" }]
    post:
      tags: [admin-contacts]
      summary: Import contacts from a file (.xlsx, .csv, .tsv, .txt, .vcf, .docx; max 10 MB, 5000 rows)
      description: Tabular files may have a header row (name, phone, email, whatsapp, telegram, slack, external_id, tags, locale — also tk/ru names); otherwise every cell is classified by shape. Existing contacts are matched by external_id, phone or e-mail and only their empty fields are filled.
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
                group_id: { type: string, format: uuid, description: add imported contacts to this group }
                dry_run: { type: string, enum: ["true", "false"], description: parse and preview only }
                tag: { type: string, description: tag added to every imported contact }
      responses:
        "200": { $ref: "#/components/responses/ImportResult" }
        "400": { $ref: "#/components/responses/Error" }
