openapi: 3.1.0
info:
  title: Habarchy API
  version: 0.5.0
  description: |
    Habarchy (Habarçy) is a self-hosted, multi-tenant notification gateway: one API to send
    SMS, email, push (Firebase FCM) and Telegram messages with queues, retries, provider
    fallback, templates, delivery status, webhooks and an admin panel.

    Two APIs share this document:
    * **Public API** `/api/v1` — called by client applications with an API key (`X-Api-Key`),
      optionally HMAC-signed (`X-Signature`, `X-Timestamp`). Keys carry scopes.
    * **Admin API** `/api/admin` — used by the web and mobile admin apps with a JWT
      (`Authorization: Bearer`). Project routes are role based (owner > admin > developer > viewer).

    Every response is wrapped in an envelope `{ "data": ..., "meta": ..., "error": {"code","message","details"} }`.
servers:
  - url: http://localhost:8080
tags:
  - name: public-messages
  - name: public-otp
  - name: public-templates
  - name: public-contacts
  - name: public-usage
  - name: callbacks
  - name: gateway
  - name: admin-auth
  - name: admin-projects
  - name: admin-api-keys
  - name: admin-providers
  - name: admin-templates
  - name: admin-messages
  - name: admin-webhooks
  - name: admin-insights
  - name: admin-contacts
  - name: admin-chat
  - name: admin-system
  - name: health

security: []

paths:
  /healthz:
    get:
      tags: [health]
      summary: Liveness
      responses:
        "200": { $ref: "#/components/responses/Status" }
  /readyz:
    get:
      tags: [health]
      summary: Readiness (database + Redis)
      responses:
        "200": { $ref: "#/components/responses/Status" }
        "503": { $ref: "#/components/responses/Status" }

  # ---------------------------------------------------------------- public
  /api/v1/me:
    get:
      tags: [public-usage]
      summary: Identify the API key and its project
      security: [{ ApiKey: [] }]
      responses:
        "200":
          description: Key info
          content: { application/json: { schema: { $ref: "#/components/schemas/Envelope" } } }
        "401": { $ref: "#/components/responses/Error" }

  /api/v1/messages:
    post:
      tags: [public-messages]
      summary: Send a message
      description: "Returns **202** once the message is queued. Use `channel: auto` with a contact reference to let Habarchy pick the best channel."
      security: [{ ApiKey: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/SendMessageRequest" } } }
      responses:
        "202":
          description: Queued
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties: { data: { $ref: "#/components/schemas/Accepted" } }
        "200":
          description: Idempotent replay of an earlier request (`meta.duplicate = true`)
          content: { application/json: { schema: { $ref: "#/components/schemas/MessageEnvelope" } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
    get:
      tags: [public-messages]
      summary: List messages (cursor pagination)
      security: [{ ApiKey: [] }]
      parameters:
        - { name: status, in: query, schema: { $ref: "#/components/schemas/MessageStatus" } }
        - { name: channel, in: query, schema: { $ref: "#/components/schemas/Channel" } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { name: cursor, in: query, schema: { type: string, format: uuid }, description: id of the last item of the previous page }
        - { name: limit, in: query, schema: { type: integer, default: 50, maximum: 200 } }
      responses:
        "200":
          description: Page of messages
          content: { application/json: { schema: { $ref: "#/components/schemas/MessageListEnvelope" } } }
        "400": { $ref: "#/components/responses/Error" }
  /api/v1/messages/batch:
    post:
      tags: [public-messages]
      summary: Send one template to up to 1000 recipients
      security: [{ ApiKey: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/SendBatchRequest" } } }
      responses:
        "202":
          description: Batch created; `meta.accepted` and `meta.rejected` describe the recipients
          content: { application/json: { schema: { $ref: "#/components/schemas/BatchEnvelope" } } }
        "200":
          description: Idempotent replay
          content: { application/json: { schema: { $ref: "#/components/schemas/BatchEnvelope" } } }
        "400": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /api/v1/messages/{message_id}:
    parameters: [{ $ref: "#/components/parameters/MessageID" }]
    get:
      tags: [public-messages]
      summary: Message status and timeline
      security: [{ ApiKey: [] }]
      responses:
        "200":
          description: Message with events
          content: { application/json: { schema: { $ref: "#/components/schemas/MessageDetailEnvelope" } } }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/messages/{message_id}/cancel:
    parameters: [{ $ref: "#/components/parameters/MessageID" }]
    post:
      tags: [public-messages]
      summary: Cancel a queued or scheduled message
      security: [{ ApiKey: [] }]
      responses:
        "200":
          description: Cancelled message
          content: { application/json: { schema: { $ref: "#/components/schemas/MessageEnvelope" } } }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/batches/{batch_id}:
    parameters: [{ name: batch_id, in: path, required: true, schema: { type: string, format: uuid } }]
    get:
      tags: [public-messages]
      summary: Batch progress
      security: [{ ApiKey: [] }]
      responses:
        "200":
          description: Batch
          content: { application/json: { schema: { $ref: "#/components/schemas/BatchEnvelope" } } }
        "404": { $ref: "#/components/responses/Error" }

  /api/v1/otp/send:
    post:
      tags: [public-otp]
      summary: Send a one-time code
      security: [{ ApiKey: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/OTPSendRequest" } } }
      responses:
        "202":
          description: Code sent
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties: { data: { $ref: "#/components/schemas/OTPSendResult" } }
        "429": { $ref: "#/components/responses/Error" }
  /api/v1/otp/verify:
    post:
      tags: [public-otp]
      summary: Verify a one-time code
      security: [{ ApiKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to, code]
              properties: { to: { type: string }, code: { type: string } }
      responses:
        "200":
          description: Verified
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties: { data: { $ref: "#/components/schemas/OTPVerifyResult" } }
        "401": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }

  /api/v1/templates:
    get:
      tags: [public-templates]
      summary: List templates
      security: [{ ApiKey: [] }]
      parameters: [{ name: key, in: query, schema: { type: string } }]
      responses:
        "200": { $ref: "#/components/responses/TemplateList" }
    post:
      tags: [public-templates]
      summary: Create a template
      security: [{ ApiKey: [] }]
      requestBody: { $ref: "#/components/requestBodies/Template" }
      responses:
        "201": { $ref: "#/components/responses/Template" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/templates/preview:
    post:
      tags: [public-templates]
      summary: Render ad hoc content with sample data
      security: [{ ApiKey: [] }]
      requestBody: { $ref: "#/components/requestBodies/Preview" }
      responses:
        "200": { $ref: "#/components/responses/Preview" }
  /api/v1/templates/{template_id}:
    parameters: [{ $ref: "#/components/parameters/TemplateID" }]
    get:
      tags: [public-templates]
      summary: Get a template
      security: [{ ApiKey: [] }]
      responses:
        "200": { $ref: "#/components/responses/Template" }
        "404": { $ref: "#/components/responses/Error" }
    put:
      tags: [public-templates]
      summary: Update a template (creates a new version)
      security: [{ ApiKey: [] }]
      requestBody: { $ref: "#/components/requestBodies/TemplateUpdate" }
      responses:
        "200": { $ref: "#/components/responses/Template" }
    delete:
      tags: [public-templates]
      summary: Delete a template
      security: [{ ApiKey: [] }]
      responses:
        "204": { description: Deleted }

  /api/v1/groups:
    get:
      tags: [public-contacts]
      summary: List contact groups
      security: [{ ApiKey: [] }]
      responses:
        "200": { $ref: "#/components/responses/GroupList" }
    post:
      tags: [public-contacts]
      summary: Create a group
      security: [{ ApiKey: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/GroupRequest" } } } }
      responses:
        "201": { $ref: "#/components/responses/Group" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/groups/{group_id}:
    parameters: [ { name: group_id, in: path, required: true, schema: { type: string, format: uuid } }]
    get:
      tags: [public-contacts]
      summary: Get a group
      security: [{ ApiKey: [] }]
      responses:
        "200": { $ref: "#/components/responses/Group" }
    put:
      tags: [public-contacts]
      summary: Rename a group
      security: [{ ApiKey: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/GroupRequest" } } } }
      responses:
        "200": { $ref: "#/components/responses/Group" }
    delete:
      tags: [public-contacts]
      summary: Delete a group (contacts stay)
      security: [{ ApiKey: [] }]
      responses:
        "204": { description: Deleted }
  /api/v1/groups/{group_id}/members:
    parameters: [ { name: group_id, in: path, required: true, schema: { type: string, format: uuid } }]
    get:
      tags: [public-contacts]
      summary: List members
      security: [{ ApiKey: [] }]
      parameters: [{ $ref: "#/components/parameters/Limit" }, { $ref: "#/components/parameters/Offset" }]
      responses:
        "200": { $ref: "#/components/responses/ContactList" }
    post:
      tags: [public-contacts]
      summary: Add members (existing contacts or new ones inline)
      security: [{ ApiKey: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/GroupMembersRequest" } } } }
      responses:
        "200":
          description: Result
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties: { data: { $ref: "#/components/schemas/GroupMembersResult" } }
  /api/v1/groups/{group_id}/members/{contact_id}:
    parameters: [ { name: group_id, in: path, required: true, schema: { type: string, format: uuid } }, { name: contact_id, in: path, required: true, schema: { type: string, format: uuid } }]
    delete:
      tags: [public-contacts]
      summary: Remove a member
      security: [{ ApiKey: [] }]
      responses:
        "204": { description: Removed }
  /api/v1/inbound:
    get:
      tags: [public-messages]
      summary: SMS received by the project's Android gateway phones (newest first)
      description: Requires `messages:read`. Only phones whose provider has `inbound_enabled` (default true) and whose app switch is on forward SMS; the `sms.inbound` webhook fires for each one.
      security: [{ ApiKey: [] }]
      parameters: [{ $ref: "#/components/parameters/Limit" }, { $ref: "#/components/parameters/Offset" }]
      responses:
        "200":
          description: Inbound SMS
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties: { data: { type: array, items: { $ref: "#/components/schemas/InboundSMS" } } }
  /api/v1/contacts:
    get:
      tags: [public-contacts]
      summary: List contacts
      security: [{ ApiKey: [] }]
      parameters:
        - { name: tag, in: query, schema: { type: string } }
        - { name: search, in: query, schema: { type: string } }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Offset" }
      responses:
        "200": { $ref: "#/components/responses/ContactList" }
    post:
      tags: [public-contacts]
      summary: Create or upsert (by external_id) a contact
      security: [{ ApiKey: [] }]
      requestBody: { $ref: "#/components/requestBodies/Contact" }
      responses:
        "201": { $ref: "#/components/responses/Contact" }
        "200": { $ref: "#/components/responses/Contact" }
        "400": { $ref: "#/components/responses/Error" }
  /api/v1/contacts/import:
    post:
      tags: [public-contacts]
      summary: Import contacts from a file (same as the admin endpoint; scope contacts)
      security: [{ ApiKey: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
                group_id: { type: string, format: uuid }
                dry_run: { type: string, enum: ["true", "false"] }
                tag: { type: string }
      responses:
        "200": { $ref: "#/components/responses/ImportResult" }
  /api/v1/contacts/{contact_id}:
    parameters: [{ name: contact_id, in: path, required: true, schema: { type: string, format: uuid } }]
    get:
      tags: [public-contacts]
      summary: Get a contact
      security: [{ ApiKey: [] }]
      responses:
        "200": { $ref: "#/components/responses/Contact" }
        "404": { $ref: "#/components/responses/Error" }
    put:
      tags: [public-contacts]
      summary: Update a contact
      security: [{ ApiKey: [] }]
      requestBody: { $ref: "#/components/requestBodies/Contact" }
      responses:
        "200": { $ref: "#/components/responses/Contact" }
    delete:
      tags: [public-contacts]
      summary: Delete a contact
      security: [{ ApiKey: [] }]
      responses:
        "204": { description: Deleted }
  /api/v1/devices:
    get:
      tags: [public-contacts]
      summary: List devices
      security: [{ ApiKey: [] }]
      parameters: [{ $ref: "#/components/parameters/Limit" }, { $ref: "#/components/parameters/Offset" }]
      responses:
        "200":
          description: Devices
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties: { data: { type: array, items: { $ref: "#/components/schemas/Device" } } }
    post:
      tags: [public-contacts]
      summary: Register an FCM token
      security: [{ ApiKey: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/DeviceRequest" } } }
      responses:
        "201":
          description: Device
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties: { data: { $ref: "#/components/schemas/Device" } }
  /api/v1/devices/{token}:
    parameters: [{ name: token, in: path, required: true, schema: { type: string } }]
    delete:
      tags: [public-contacts]
      summary: Remove an FCM token
      security: [{ ApiKey: [] }]
      responses:
        "204": { description: Removed }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/usage:
    get:
      tags: [public-usage]
      summary: Usage report
      security: [{ ApiKey: [] }]
      parameters:
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { name: group_by, in: query, schema: { type: string, enum: [channel, day] } }
      responses:
        "200": { $ref: "#/components/responses/UsageList" }

  /callbacks/sms/{provider_id}:
    parameters: [{ name: provider_id, in: path, required: true, schema: { type: string, format: uuid } }]
    post:
      tags: [callbacks]
      summary: HTTP SMS delivery report
      description: Called by the SMS gateway. Fields are mapped by the provider's `dlr` configuration (query, form or JSON).
      responses:
        "200": { $ref: "#/components/responses/Status" }
        "404": { $ref: "#/components/responses/Error" }
    get:
      tags: [callbacks]
      summary: HTTP SMS delivery report (GET variant)
      responses:
        "200": { $ref: "#/components/responses/Status" }

  # ---------------------------------------------------------------- admin auth
  /api/admin/auth/login:
    post:
      tags: [admin-auth]
      summary: Login with email and password (+ TOTP code when enabled)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
                totp_code: { type: string }
      responses:
        "200":
          description: Tokens and user
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          tokens: { $ref: "#/components/schemas/Tokens" }
                          user: { $ref: "#/components/schemas/User" }
        "401":
          description: Invalid credentials, or `error.details.totp_required = true`
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
  /api/admin/auth/refresh:
    post:
      tags: [admin-auth]
      summary: Rotate the refresh token
      requestBody: { $ref: "#/components/requestBodies/RefreshToken" }
      responses:
        "200":
          description: New token pair
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties: { tokens: { $ref: "#/components/schemas/Tokens" } }
        "401": { $ref: "#/components/responses/Error" }
  /api/admin/auth/logout:
    post:
      tags: [admin-auth]
      summary: Revoke a refresh token
      requestBody: { $ref: "#/components/requestBodies/RefreshToken" }
      responses:
        "204": { description: Logged out }
  /api/admin/auth/logout-all:
    post:
      tags: [admin-auth]
      summary: Revoke all sessions of the current user
      security: [{ BearerAuth: [] }]
      responses:
        "204": { description: Done }
  /api/admin/me:
    get:
      tags: [admin-auth]
      summary: Current user
      security: [{ BearerAuth: [] }]
      responses:
        "200": { $ref: "#/components/responses/User" }
  /api/admin/me/password:
    put:
      tags: [admin-auth]
      summary: Change password (revokes other sessions)
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties: { current_password: { type: string }, new_password: { type: string, minLength: 8 } }
      responses:
        "204": { description: Changed }
        "401": { $ref: "#/components/responses/Error" }
  /api/admin/me/totp/setup:
    post:
      tags: [admin-auth]
      summary: Start 2FA setup (returns secret and otpauth URL once)
      security: [{ BearerAuth: [] }]
      responses:
        "200":
          description: Secret
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties: { secret: { type: string }, otpauth_url: { type: string } }
  /api/admin/me/totp/confirm:
    post:
      tags: [admin-auth]
      summary: Enable 2FA with a valid code
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [code], properties: { code: { type: string } } } } }
      responses:
        "204": { description: Enabled }
  /api/admin/me/totp/disable:
    post:
      tags: [admin-auth]
      summary: Disable 2FA (password required)
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [password], properties: { password: { type: string } } } } }
      responses:
        "204": { description: Disabled }

  # ---------------------------------------------------------------- admin system
  /api/admin/users:
    get:
      tags: [admin-system]
      summary: List users
      security: [{ BearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/Limit" }, { $ref: "#/components/parameters/Offset" }]
      responses:
        "200":
          description: Users
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties: { data: { type: array, items: { $ref: "#/components/schemas/User" } } }
    post:
      tags: [admin-system]
      summary: Create a user
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties: { email: { type: string, format: email }, password: { type: string, minLength: 8 }, full_name: { type: string } }
      responses:
        "201": { $ref: "#/components/responses/User" }
        "409": { $ref: "#/components/responses/Error" }
  /api/admin/overview:
    get:
      tags: [admin-system]
      summary: Global counters
      security: [{ BearerAuth: [] }]
      responses:
        "200":
          description: Counters
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties: { data: { $ref: "#/components/schemas/Overview" } }
  /api/admin/stream:
    get:
      tags: [admin-system]
      summary: Server-Sent Events of live message status
      description: Token via `Authorization` header, `?access_token=` or the `habarchy_access` cookie. Events `message.queued|sent|delivered|failed` with a JSON body.
      security: [{ BearerAuth: [] }]
      parameters: [{ name: project_id, in: query, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: text/event-stream }

  # ---------------------------------------------------------------- admin projects
  /api/admin/projects:
    get:
      tags: [admin-projects]
      summary: Projects of the current user
      security: [{ BearerAuth: [] }]
      responses:
        "200": { $ref: "#/components/responses/ProjectList" }
    post:
      tags: [admin-projects]
      summary: Create a project (caller becomes owner)
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CreateProjectRequest" } } }
      responses:
        "201": { $ref: "#/components/responses/Project" }
        "409": { $ref: "#/components/responses/Error" }
  /api/admin/projects/{project_id}:
    parameters: [{ $ref: "#/components/parameters/ProjectID" }]
    get:
      tags: [admin-projects]
      summary: Project details
      security: [{ BearerAuth: [] }]
      responses:
        "200": { $ref: "#/components/responses/Project" }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      tags: [admin-projects]
      summary: Update project settings (admin role)
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
